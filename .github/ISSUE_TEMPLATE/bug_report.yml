name: Bug report
description: Untranslated Japanese, cut-off or overlapping text, broken glyphs, crashes
labels: [bug]
body:
  - type: input
    id: build
    attributes:
      label: Patched ISO MD5
      description: RC01 should be 7e834ed083969bc379b43cc2a57714d8
    validations: {required: true}
  - type: input
    id: platform
    attributes:
      label: How are you running it?
      description: PCSX2 (version) / OPL (how loaded) / real console
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and on which screen?
      description: Attach a screenshot if you can.
    validations: {required: true}
